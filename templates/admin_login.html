{% extends 'base.html' %}{% block title %}Admin Login{% endblock %}
{% block content %}
<form class="card narrow center" method="post" style="margin-top:80px">
  <span class="badge b-red">🔐 ADMIN ACCESS</span><h2 class="mt">Admin Login</h2><p class="muted mb">Sign in to manage the platform</p>
  <input name="username" placeholder="👤 Username" required autofocus><input type="password" name="password" placeholder="🔒 Password" required>
  <button class="btn block">Login</button>
  <p class="muted mt"><a href="{{ url_for('login') }}">← User login</a></p>
</form>
{% endblock %}
