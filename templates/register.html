{% extends 'base.html' %}{% block title %}Register{% endblock %}
{% block content %}
<div class="hero"><h1>💬 AI-Based <span>Resume Analyzer</span></h1><p>Create your account</p></div>
<form class="card narrow" method="post">
  <h2 class="center mb">User Registration</h2>
  <input name="first_name" placeholder="First name" required>
  <input name="last_name" placeholder="Last name">
  <input type="email" name="email" placeholder="Email" required>
  <input name="phone" placeholder="Phone" pattern="[0-9+ ]{7,15}">
  <input type="password" name="password" placeholder="Password (min 6 chars)" minlength="6" required>
  <input type="password" name="confirm" placeholder="Confirm password" required>
  <button class="btn block" type="submit">Register</button>
  <p class="muted center mt">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</form>
{% endblock %}
